<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5,viewport-fit=cover,user-scalable=yes">
<meta name="theme-color" content="#111827">
<link rel="manifest" href="manifest.json">
<title>爆弾探し</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#0f172a;color:#f8fafc;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{min-height:100vh;display:flex;justify-content:center;touch-action:auto}
button{font:inherit}
.app{width:min(100%,720px);min-height:100vh;padding:14px 10px 24px}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
h1{font-size:20px;margin:0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px}
.stat{background:#1e293b;border-radius:10px;padding:7px 4px;text-align:center}
.stat small{display:block;color:#94a3b8;font-size:11px}.stat strong{font-size:18px}
.board-wrap{background:#020617;padding:5px;border-radius:10px;box-shadow:0 10px 30px #0006}
.board{display:grid;grid-template-columns:repeat(27,minmax(0,1fr));grid-template-rows:repeat(27,minmax(0,1fr));width:100%;height:auto;aspect-ratio:1/1;gap:1px;background:#334155;touch-action:auto;min-width:0;min-height:0}
.cell{border:0;margin:0;padding:0;background:#64748b;color:#fff;font-weight:800;font-size:clamp(7px,2.8vw,18px);line-height:1;display:flex;align-items:center;justify-content:center;user-select:none;-webkit-user-select:none;touch-action:auto;min-width:0;min-height:0;width:100%;height:100%;overflow:hidden}
.cell.open{background:#e2e8f0;color:#0f172a}
.cell.flag{background:#f59e0b;color:#111827}
.cell.mine-hit{background:#ef4444;color:#fff}
.cell.mine-reveal{background:#fb7185;color:#fff}
.cell.n1{color:#2563eb}.cell.n2{color:#16a34a}.cell.n3{color:#dc2626}.cell.n4{color:#7c3aed}.cell.n5{color:#c2410c}.cell.n6{color:#0891b2}.cell.n7{color:#111827}.cell.n8{color:#475569}
.controls{display:flex;gap:8px;margin:12px 0}.controls button,.level-actions button{flex:1;border:0;border-radius:10px;padding:11px;background:#334155;color:white;font-weight:700}
.primary{background:#2563eb!important}.danger{background:#dc2626!important}
.panel{background:#1e293b;border-radius:12px;padding:12px;margin-top:10px}
.panel h2{font-size:16px;margin:0 0 8px}.levels{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
.level{border:0;border-radius:9px;padding:10px 2px;background:#334155;color:white;font-weight:700}
.level.locked{opacity:.35}.level.done{background:#166534}.level.current{outline:2px solid #60a5fa}
.overlay{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;padding:20px;z-index:5}
.modal{width:min(100%,380px);background:#f8fafc;color:#0f172a;border-radius:18px;padding:22px;text-align:center}
.modal h2{margin:0 0 8px;font-size:28px}.modal p{margin:7px 0 18px;color:#475569}
.modal button{width:100%;border:0;border-radius:11px;padding:13px;margin-top:8px;background:#2563eb;color:#fff;font-weight:800}
.tip{font-size:12px;color:#94a3b8;text-align:center;margin:9px 0 0}
.home{min-height:calc(100vh - 40px);display:flex;flex-direction:column;justify-content:center;gap:16px}
.home-card{background:#1e293b;border-radius:18px;padding:28px 18px;text-align:center;box-shadow:0 10px 30px #0004}
.home-card h1{font-size:32px;margin:0 0 8px}.home-card p{color:#94a3b8;margin:0 0 22px}
.home-actions{display:flex;flex-direction:column;gap:10px}
.home-actions button{border:0;border-radius:12px;padding:15px;background:#334155;color:#fff;font-weight:800;font-size:17px}
.home-actions .primary{background:#2563eb!important}
.home-levels{display:none;background:#1e293b;border-radius:12px;padding:12px}
.home-levels h2{font-size:16px;margin:0 0 8px}
@media (min-width:600px){.app{padding-top:24px}.levels{grid-template-columns:repeat(10,1fr)}}

.rank-badge{display:inline-block;min-width:28px;padding:2px 6px;border-radius:7px;font-weight:900;text-align:center}
.rank-S{background:#f5c542;color:#111}.rank-A{background:#c7cbd1;color:#111}.rank-B{background:#b87333;color:#fff}.rank-C{background:#39a85a;color:#fff}
.rank-guide{font-size:12px;line-height:1.7;color:#94a3b8;text-align:center;margin:8px 0}
.flag-mode{background:#7c3aed!important}
.controls{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}.controls button{flex:1;min-width:120px}
</style>
</head>
<body>
<div class="app">
  <section id="homeScreen" class="home">
    <div class="home-card">
      <div style="font-size:52px">💣</div>
      <h1>爆弾探し</h1>
      <p>27×27のマスから爆弾を探そう</p>
      <div class="home-actions">
        <button id="homeStart" class="primary">ゲームスタート</button>
        <button id="homeLevelBtn">レベル選択</button>
      </div>
    </div>
    <div id="homeLevels" class="home-levels">
      <h2>レベル選択</h2>
      <div id="levels" class="levels"></div>
    </div>
    <p class="tip">レベルを選んでからゲームをスタートできます</p>
  </section>

  <section id="gameScreen" style="display:none">
    <header><h1>💣 爆弾探し</h1><div id="levelTitle">LEVEL 1</div></header>
    <div class="stats">
      <div class="stat"><small>経過時間</small><strong id="time">0.0秒</strong></div>
      <div class="stat"><small>爆弾</small><strong id="bombs">5 / 5</strong></div>
      <div class="stat"><small>ベスト</small><strong id="best">--</strong></div>
    </div>
    <div class="board-wrap"><div id="board" class="board" aria-label="27×27ゲーム盤"></div></div>
    <div class="controls">
      <button id="restart">↻ このレベルをやり直す</button>
      <button id="levelsBtn">ホーム</button>
    </div>
    <div id="rankGuide" class="rank-guide"></div><div class="controls"><button id="flagModeBtn">⚑ 旗モード：OFF</button><button id="restart">↻ このレベルをやり直す</button><button id="levelsBtn">ホーム</button></div><p class="tip">通常：タップで開く／長押しで旗　・　旗モードON：タップで旗</p>
  </section>
</div>

<div id="overlay" class="overlay">
  <div class="modal">
    <h2 id="resultTitle"></h2>
    <p id="resultText"></p>
    <button id="retryBtn">もう一度挑戦</button>
    <button id="nextBtn" class="primary">次のレベル</button>
    <button id="backBtn" style="background:#334155">ホームへ</button>
  </div>
</div>

<script>
const SIZE=27,TOTAL=729,MAX_LEVEL=100;
const keyProgress="bombHuntProgressV1",keyBest="bombHuntBestV1",keyRanks="bombHuntRanksV1";
let progress=+localStorage.getItem(keyProgress)||1,best=JSON.parse(localStorage.getItem(keyBest)||"{}"),ranks=JSON.parse(localStorage.getItem(keyRanks)||"{}");
let level=1,bombs=5,board=[],cells=[],flags=0,opened=0,elapsed=0,timer=null,gameOver=false,hitIndex=-1,flagMode=false;

function bombCount(l){return Math.round(5+155*Math.pow((l-1)/99,.88))}
function thresholds(l){let t=Math.round(25+bombCount(l)*.9);return{S:Math.round(t*.65),A:t,B:Math.round(t*1.4)}}
function rankFor(l,t){let x=thresholds(l);return t<=x.S?"S":t<=x.A?"A":t<=x.B?"B":"C"}
function rankValue(r){return({S:4,A:3,B:2,C:1}[r]||0)}
function fmt(t){return t.toFixed(1)+"秒"}
function idx(r,c){return r*SIZE+c}
function rc(i){return[Math.floor(i/SIZE),i%SIZE]}
function neighbors(i){let[r,c]=rc(i),a=[];for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){if(!dr&&!dc){continue}let R=r+dr,C=c+dc;if(R>=0&&R<SIZE&&C>=0&&C<SIZE)a.push(idx(R,C))}return a}
function stop(){if(timer){clearInterval(timer);timer=null}}
function showHome(){stop();document.getElementById("overlay").style.display="none";document.getElementById("gameScreen").style.display="none";document.getElementById("homeScreen").style.display="flex";document.getElementById("homeLevels").style.display="none";renderLevels()}
function showGame(){document.getElementById("homeScreen").style.display="none";document.getElementById("gameScreen").style.display="block"}
function start(l=level){
 stop();level=l;bombs=bombCount(l);flags=0;opened=0;elapsed=0;gameOver=false;hitIndex=-1;flagMode=false;showGame();
 board=Array.from({length:TOTAL},()=>({mine:false,open:false,flag:false,n:0}));
 let pool=[...Array(TOTAL).keys()];for(let i=TOTAL-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}
 for(let i=0;i<bombs;i++)board[pool[i]].mine=true;
 for(let i=0;i<TOTAL;i++)board[i].n=neighbors(i).filter(j=>board[j].mine).length;
 render();update();guide();flagButton();timer=setInterval(()=>{if(!gameOver){elapsed+=.1;update()}},100)
}
function render(){let el=document.getElementById("board");el.innerHTML="";cells=[];for(let i=0;i<TOTAL;i++){let b=document.createElement("button");b.className="cell";b.dataset.i=i;b.addEventListener("pointerdown",down);b.addEventListener("pointerup",up);b.addEventListener("pointercancel",cancel);b.addEventListener("contextmenu",e=>e.preventDefault());el.appendChild(b);cells.push(b)}paint()}
function paint(){for(let i=0;i<TOTAL;i++){let b=cells[i],x=board[i];b.className="cell";b.textContent="";if(x.open){b.classList.add("open");if(x.mine){b.classList.add(i===hitIndex?"mine-hit":"mine-reveal");b.textContent="💣"}else if(x.n){b.classList.add("n"+x.n);b.textContent=x.n}}else if(x.flag){b.classList.add("flag");b.textContent="⚑"}}}
let pressTimer=null,pressed=-1,longDone=false;
function down(e){if(gameOver)return;pressed=+e.currentTarget.dataset.i;longDone=false;clearTimeout(pressTimer);if(!flagMode)pressTimer=setTimeout(()=>{longDone=true;toggleFlag(pressed)},500)}
function up(){clearTimeout(pressTimer);if(longDone)return;if(flagMode)toggleFlag(pressed);else openCell(pressed)}
function cancel(){clearTimeout(pressTimer)}
function toggleFlag(i){if(gameOver||board[i].open)return;board[i].flag=!board[i].flag;flags+=board[i].flag?1:-1;paint();update();check()}
function openCell(i){if(gameOver||board[i].open||board[i].flag)return;if(board[i].mine){hitIndex=i;board[i].open=true;finish(false,"GAME OVER");return}flood(i);paint();update();check()}
function flood(start){let q=[start],seen=new Set([start]);while(q.length){let i=q.shift();if(board[i].open||board[i].flag||board[i].mine)continue;board[i].open=true;opened++;if(board[i].n===0)for(let j of neighbors(i))if(!seen.has(j)&&!board[j].mine&&!board[j].flag){seen.add(j);q.push(j)}}}
function check(){if(!gameOver&&opened===TOTAL-bombs)finish(true,"CLEAR!")}
function finish(win,title){
 gameOver=true;stop();
 if(win){
  let r=rankFor(level,elapsed);if(!ranks[level]||rankValue(r)>rankValue(ranks[level])){ranks[level]=r;localStorage.setItem(keyRanks,JSON.stringify(ranks))}
  if(!best[level]||elapsed<best[level]){best[level]=elapsed;localStorage.setItem(keyBest,JSON.stringify(best))}
  if(level===progress&&progress<MAX_LEVEL){progress++;localStorage.setItem(keyProgress,progress)}
  paint();update();renderLevels();document.getElementById("resultTitle").innerHTML=`CLEAR! <span class="rank-badge rank-${r}">${r}</span>`;
  let t=thresholds(level);document.getElementById("resultText").innerHTML=`LEVEL ${level} クリア！<br>タイム：${fmt(elapsed)}<br>S ${t.S}秒 / A ${t.A}秒 / B ${t.B}秒`;
  document.getElementById("nextBtn").style.display=level<MAX_LEVEL?"block":"none"
 }else{board.forEach(x=>{if(x.mine)x.open=true});paint();document.getElementById("resultTitle").textContent=title;document.getElementById("resultText").textContent="爆弾を開いてしまいました。";document.getElementById("nextBtn").style.display="none"}
 document.getElementById("overlay").style.display="flex"
}
function update(){document.getElementById("levelTitle").textContent=`LEVEL ${level}`;document.getElementById("time").textContent=fmt(elapsed);document.getElementById("bombs").textContent=`${Math.max(0,bombs-flags)} / ${bombs}`;document.getElementById("best").textContent=best[level]!=null?fmt(best[level]):"--"}
function guide(){let t=thresholds(level);document.getElementById("rankGuide").innerHTML=`クリア目安： <b class="rank-S">S</b> ${t.S}秒以内　 <b class="rank-A">A</b> ${t.A}秒以内　 <b class="rank-B">B</b> ${t.B}秒以内　 <b class="rank-C">C</b> それより遅く`}
function flagButton(){let b=document.getElementById("flagModeBtn");b.textContent=flagMode?"⚑ 旗モード：ON":"⚑ 旗モード：OFF";b.classList.toggle("flag-mode",flagMode)}
function renderLevels(){let el=document.getElementById("levels");if(!el)return;el.innerHTML="";for(let l=1;l<=MAX_LEVEL;l++){let b=document.createElement("button");b.className="level";let unlocked=l<=progress;if(!unlocked)b.classList.add("locked");let r=ranks[l]||(best[l]!=null?rankFor(l,best[l]):null);b.innerHTML=unlocked?(r?`${l} <span class="rank-badge rank-${r}">${r}</span>`:`${l}`):"🔒";b.disabled=!unlocked;b.onclick=()=>{document.getElementById("homeLevels").style.display="none";start(l)};el.appendChild(b)}}
document.getElementById("homeStart").onclick=()=>start(level);
document.getElementById("homeLevelBtn").onclick=()=>{let p=document.getElementById("homeLevels");p.style.display=p.style.display==="none"?"block":"none";renderLevels()};
document.getElementById("flagModeBtn").onclick=()=>{flagMode=!flagMode;flagButton()};
document.getElementById("restart").onclick=()=>start(level);
document.getElementById("levelsBtn").onclick=showHome;
document.getElementById("retryBtn").onclick=()=>{document.getElementById("overlay").style.display="none";start(level)};
document.getElementById("nextBtn").onclick=()=>{document.getElementById("overlay").style.display="none";start(Math.min(MAX_LEVEL,level+1))};
document.getElementById("backBtn").onclick=showHome;
renderLevels();showHome();
if("serviceWorker"in navigator&&location.protocol!=="file:")navigator.serviceWorker.register("./sw.js");
</script>
</body>
</html>
